<div id="screen-nueva-venta" class="screen">
    <div class="screen-scroll">
      <div class="sub-header">
        <div class="back-btn" onclick="App.showScreen('inicio')" role="button" aria-label="Volver"><span class="ms">arrow_back</span></div>
        <span class="sub-title">Nueva venta</span>
        <div class="back-btn" style="visibility:hidden"><span class="ms">arrow_back</span></div>
      </div>

      <div class="live-profit">
        <div class="live-profit-header">
          <span class="live-profit-label">Ganancia estimada</span>
          <span class="live-profit-badge"><span class="ms">bolt</span>en vivo</span>
        </div>
        <div class="live-profit-amount" id="live-ganancia">+$0</div>
        <div class="live-profit-detail">
          <span>Venta <span class="text-primary" id="live-venta">$0</span></span>
          <span>Compra <span class="text-primary" id="live-compra">$0</span></span>
          <span>Margen <span class="gold" id="live-margen">0%</span></span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">PERFUME</label>
        <div class="select-field" onclick="App.openPerfumeSelector()">
          <span class="ms gold">local_mall</span>
          <span class="select-value" id="venta-perfume-display">Elegir perfume…</span>
          <span class="ms muted" style="margin-left:auto;">expand_more</span>
        </div>
        <input type="hidden" id="venta-perfume-id">
        <input type="hidden" id="venta-perfume-nombre">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">PRECIO VENTA</label>
          <input type="text" class="form-input" id="venta-precio" placeholder="0" inputmode="decimal" autocomplete="off" oninput="App.calcLiveProfit()">
        </div>
        <div class="form-group">
          <label class="form-label">PRECIO COMPRA</label>
          <input type="text" class="form-input" id="venta-compra" placeholder="0" inputmode="decimal" autocomplete="off" oninput="App.calcLiveProfit()">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">PROVEEDOR</label>
        <input type="text" class="form-input" id="venta-proveedor" placeholder="Nombre del proveedor…" autocomplete="off">
        <div class="autocomplete-list hidden" id="ac-proveedor"></div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">CLIENTE</label>
          <input type="text" class="form-input" id="venta-cliente" placeholder="Nombre…" autocomplete="off">
          <div class="autocomplete-list hidden" id="ac-cliente"></div>
        </div>
        <div class="form-group" id="vendedor-group">
          <label class="form-label">VENDEDOR <span class="pro-badge" id="vendedor-pro-badge" style="display:none;font-size:10px;background:var(--gold);color:var(--bg);padding:2px 6px;border-radius:3px;margin-left:6px;">PRO</span></label>
          <input type="text" class="form-input" id="venta-vendedor" placeholder="Nombre…" value="Luccas" autocomplete="off">
          <div class="autocomplete-list hidden" id="ac-vendedor"></div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">DESCUENTO %</label>
          <input type="number" class="form-input" id="venta-descuento" placeholder="0" min="0" max="100" oninput="App.calcLiveProfit()">
        </div>
        <div class="form-group">
          <label class="form-label">FECHA</label>
          <input type="date" class="form-input" id="venta-fecha">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">FORMA DE PAGO</label>
        <div class="segmented" id="seg-forma-pago">
          <div class="seg-option active" onclick="App.setFormaPago('contado')">Contado</div>
          <div class="seg-option" onclick="App.setFormaPago('cuotas')">Cuotas</div>
        </div>
      </div>

      <div class="form-group hidden" id="cuotas-config">
        <label class="form-label">NÚMERO DE CUOTAS</label>
        <div class="form-row">
          <input type="number" class="form-input" id="venta-num-cuotas" value="2" min="2" max="12" placeholder="2" oninput="App.calcLiveProfit()">
        </div>
        <label class="form-label" style="margin-top:12px;">PRIMERA CUOTA</label>
        <div class="segmented" id="seg-primera-cuota">
          <div class="seg-option active" onclick="App.setPrimeraCuota(true)">Cobrada ahora</div>
          <div class="seg-option" onclick="App.setPrimeraCuota(false)">Sin cobrar</div>
        </div>
        <div id="primer-pago-wrap">
          <label class="form-label" style="margin-top:12px;">MONTO COBRADO AHORA <span class="muted-label">(vacío = 1ª cuota completa)</span></label>
          <input type="text" class="form-input" id="venta-primer-pago" placeholder="" inputmode="decimal" autocomplete="off">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">NOTA <span class="muted-label">(opcional)</span></label>
        <input type="text" class="form-input" id="venta-nota" placeholder="Entrega el viernes…">
      </div>

      <div class="save-bar">
        <button class="btn-primary btn-full" onclick="App.guardarVenta()">
          <span class="ms">save</span>Guardar venta
        </button>
      </div>
    </div>
  </div>
