<div id="screen-nuevo-pedido" class="screen">
    <div class="screen-scroll">
      <div class="sub-header">
        <div class="back-btn" onclick="App.showScreen('pedidos')" role="button" aria-label="Volver"><span class="ms">arrow_back</span></div>
        <span class="sub-title">Nuevo pedido</span>
        <div class="back-btn" style="visibility:hidden"><span class="ms">arrow_back</span></div>
      </div>

      <div class="pedido-section-label"><span class="ms gold">person</span> DATOS DE ENVÍO</div>

      <div class="form-group">
        <label class="form-label">NOMBRE</label>
        <input type="text" class="form-input" id="pedido-nombre" placeholder="Nombre completo…">
      </div>

      <div class="form-group">
        <label class="form-label">CÉDULA / DNI</label>
        <input type="text" class="form-input" id="pedido-cedula" placeholder="Número de documento…">
      </div>

      <div class="form-group">
        <label class="form-label">EMPRESA DE TRANSPORTE</label>
        <input type="text" class="form-input" id="pedido-transporte" placeholder="Ej: DAC, Mirtrans, Correo…">
      </div>

      <div class="form-group">
        <label class="form-label">DIRECCIÓN <span class="muted-label">(opcional)</span></label>
        <input type="text" class="form-input" id="pedido-direccion" placeholder="Dirección de envío…">
      </div>

      <div class="form-group">
        <label class="form-label">NOTA <span class="muted-label">(opcional)</span></label>
        <input type="text" class="form-input" id="pedido-nota" placeholder="Observaciones…">
      </div>

      <div class="pedido-section-label"><span class="ms gold">local_mall</span> PERFUMES DEL PEDIDO</div>

      <div id="pedido-perfumes-list" class="pedido-perfumes-list"></div>

      <button class="btn-outline-gold" onclick="App.openPedidoPerfumeSelector()">
        <span class="ms">add</span>Agregar perfume
      </button>

      <div class="save-bar">
        <button class="btn-primary btn-full" onclick="App.guardarPedido()">
          <span class="ms">save</span>Guardar pedido
        </button>
      </div>
    </div>
  </div>
