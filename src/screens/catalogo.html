<div id="screen-catalogo" class="screen">
    <div class="screen-scroll">
      <div class="sub-header">
        <div class="back-btn" onclick="App.showScreen('mas')" role="button" aria-label="Volver"><span class="ms">arrow_back</span></div>
        <span class="sub-title">Catálogo WhatsApp</span>
        <div class="back-btn" onclick="App.toggleSelectAllCatalogo()" role="button" aria-label="Seleccionar todos"><span class="ms" aria-hidden="true">select_all</span></div>
      </div>

      <p style="color:var(--text3);font-size:13px;padding:0 16px 8px;margin:0;">Seleccioná los perfumes para el catálogo:</p>

      <div id="catalogo-list" style="padding:0 16px;"></div>

      <div id="catalogo-preview" class="hidden" style="padding:16px;">
        <div class="metrics-label">VISTA PREVIA</div>
        <div id="catalogo-preview-imgs" style="display:flex;flex-direction:column;gap:12px;"></div>
      </div>

      <div style="padding:16px;display:flex;flex-direction:column;gap:8px;">
        <button class="btn-primary btn-full" onclick="App.enviarCatalogo()" id="btn-catalogo-send">
          <span class="ms">image</span>Enviar con imágenes (<span id="catalogo-count">0</span>)
        </button>
        <button class="btn-outline-gold" onclick="App.previewCatalogo()" id="btn-catalogo-preview" style="width:100%;">
          <span class="ms">visibility</span>Ver cómo queda antes
        </button>
        <button class="btn-whatsapp" onclick="App.enviarCatalogoTexto()" style="border-radius:12px;">
          <span class="ms">chat</span>Enviar solo el listado en texto
        </button>
        <p style="color:var(--text4);font-size:11px;line-height:1.5;margin:0;text-align:center;">
          WhatsApp no deja mandar imágenes desde un link, así que con imágenes se abre
          el menú de compartir del teléfono y elegís el chat.
        </p>
      </div>
    </div>
  </div>
