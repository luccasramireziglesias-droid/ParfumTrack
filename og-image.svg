<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5dfa0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9a84c;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(201,168,76,0.15);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(201,168,76,0);stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ambient glow -->
  <circle cx="600" cy="315" r="400" fill="url(#glow)"/>

  <!-- Decorative elements (top right) -->
  <circle cx="1050" cy="80" r="80" fill="rgba(201,168,76,0.08)" />
  <circle cx="1050" cy="80" r="60" fill="rgba(201,168,76,0.04)" />

  <!-- Logo bottle shape (left side) -->
  <g transform="translate(100, 180)">
    <!-- Bottle body -->
    <path d="M 40 0 L 50 20 L 50 80 Q 50 95 40 95 L 0 95 Q -10 95 -10 80 L -10 20 L 0 0 Z"
          fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6"/>
    <!-- Bottle cap -->
    <rect x="-5" y="-8" width="10" height="8" fill="url(#goldGrad)" opacity="0.8"/>
    <!-- Liquid inside (gold) -->
    <path d="M 0 50 L 40 50 Q 45 50 45 55 L 45 80 Q 45 90 40 90 L 0 90 Q -5 90 -5 80 L -5 55 Q -5 50 0 50 Z"
          fill="url(#goldGrad)" opacity="0.4"/>
  </g>

  <!-- Main text container -->
  <g>
    <!-- "Dejá de adivinar" line 1 -->
    <text x="380" y="180" font-family="Cormorant Garamond, serif" font-size="72" font-weight="700"
          fill="#f0ece4" letter-spacing="-1">Dejá de</text>

    <!-- "cuánto ganás" line 2 - with gradient -->
    <text x="380" y="270" font-family="Cormorant Garamond, serif" font-size="72" font-weight="700"
          letter-spacing="-1">
      <tspan fill="#f0ece4">adivinar </tspan>
      <tspan fill="url(#goldGrad)">cuánto ganás</tspan>
    </text>

    <!-- Subheadline -->
    <text x="380" y="330" font-family="DM Sans, sans-serif" font-size="20" font-weight="400"
          fill="#b8b5d0" opacity="0.9">
      Registrá tus ventas en segundos · Controlá tu stock · Sabé exactamente cuánto ganás
    </text>

    <!-- Badges/Features row -->
    <g>
      <!-- Badge 1: Sin descarga -->
      <rect x="380" y="380" width="140" height="40" rx="20" fill="rgba(27,27,48,0.8)" stroke="rgba(201,168,76,0.2)" stroke-width="1"/>
      <circle cx="395" cy="400" r="4" fill="#70c9a0"/>
      <text x="410" y="408" font-family="DM Sans, sans-serif" font-size="14" font-weight="500" fill="#f0ece4">Sin descarga</text>

      <!-- Badge 2: 100% offline -->
      <rect x="540" y="380" width="140" height="40" rx="20" fill="rgba(27,27,48,0.8)" stroke="rgba(201,168,76,0.2)" stroke-width="1"/>
      <circle cx="555" cy="400" r="4" fill="#70c9a0"/>
      <text x="570" y="408" font-family="DM Sans, sans-serif" font-size="14" font-weight="500" fill="#f0ece4">100% offline</text>

      <!-- Badge 3: Gratis siempre -->
      <rect x="700" y="380" width="160" height="40" rx="20" fill="rgba(27,27,48,0.8)" stroke="rgba(201,168,76,0.2)" stroke-width="1"/>
      <circle cx="715" cy="400" r="4" fill="#70c9a0"/>
      <text x="730" y="408" font-family="DM Sans, sans-serif" font-size="14" font-weight="500" fill="#f0ece4">Gratis para siempre</text>
    </g>

    <!-- CTA Button -->
    <rect x="380" y="460" width="220" height="56" rx="28" fill="url(#goldGrad)" opacity="0.95"/>
    <text x="490" y="497" font-family="DM Sans, sans-serif" font-size="18" font-weight="700"
          fill="#1a1a2e" text-anchor="middle">Empezar gratis →</text>

    <!-- Branding bottom right -->
    <g transform="translate(920, 520)">
      <!-- Logo icon -->
      <circle cx="0" cy="0" r="20" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>
      <path d="M -8 0 Q 0 -8 8 0 Q 0 8 -8 0 Z" fill="url(#goldGrad)" opacity="0.5"/>

      <!-- Brand name -->
      <text x="35" y="8" font-family="Cormorant Garamond, serif" font-size="20" font-weight="700" fill="#e8c97e">Parfum Track</text>
      <text x="35" y="24" font-family="DM Sans, sans-serif" font-size="11" font-weight="500" fill="#9a97c0">Para revendedores de LATAM</text>
    </g>
  </g>

  <!-- Border accent -->
  <line x1="0" y1="629" x2="1200" y2="629" stroke="url(#goldGrad)" stroke-width="1" opacity="0.3"/>
</svg>
