name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker
    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install --global wrangler@3.90.0

      - name: Set Worker secrets
        run: |
          [ -n "$BREVO_API_KEY" ] && printf '%s' "$BREVO_API_KEY" | wrangler secret put BREVO_API_KEY --name parfumtrack || true
          [ -n "$LICENSE_SERVER_SECRET" ] && printf '%s' "$LICENSE_SERVER_SECRET" | wrangler secret put LICENSE_SERVER_SECRET --name parfumtrack || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          LICENSE_SERVER_SECRET: ${{ secrets.LICENSE_SERVER_SECRET }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
