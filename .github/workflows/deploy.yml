name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main, staging]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build index.html from src/
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify build is committed (no drift)
        run: git diff --exit-code index.html || (echo "::error::index.html is out of sync with src/ — run 'npm run build' and commit the result" && exit 1)

  e2e:
    runs-on: ubuntu-latest
    name: E2E (Playwright)
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build index.html from src/
        run: npm run build

      # Estos 41 tests existían pero no corrían en ningún lado: estuvieron
      # rotos sin que nadie se enterara. Ahora frenan el deploy.
      - name: Run E2E
        run: npx playwright test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: [test, e2e]
    name: Deploy Worker
    steps:
      - uses: actions/checkout@v4

      - name: Install Wrangler
        run: npm install --global wrangler@3.90.0

      - name: Determine environment
        id: env
        run: |
          if [ "${{ github.ref_name }}" = "staging" ]; then
            echo "config=wrangler.staging.jsonc" >> "$GITHUB_OUTPUT"
            echo "worker_name=parfumtrack-staging" >> "$GITHUB_OUTPUT"
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          else
            echo "config=wrangler.jsonc" >> "$GITHUB_OUTPUT"
            echo "worker_name=parfumtrack" >> "$GITHUB_OUTPUT"
            echo "environment=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Set Worker secrets
        run: |
          [ -n "$BREVO_API_KEY" ] && printf '%s' "$BREVO_API_KEY" | wrangler secret put BREVO_API_KEY --name ${{ steps.env.outputs.worker_name }} || true
          [ -n "$LICENSE_SERVER_SECRET" ] && printf '%s' "$LICENSE_SERVER_SECRET" | wrangler secret put LICENSE_SERVER_SECRET --name ${{ steps.env.outputs.worker_name }} || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          LICENSE_SERVER_SECRET: ${{ secrets.LICENSE_SERVER_SECRET }}

      - name: Deploy (${{ steps.env.outputs.environment }})
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config ${{ steps.env.outputs.config }}
